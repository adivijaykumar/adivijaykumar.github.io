<ul class="socials" aria-label="Elsewhere">
  {% if site.email %}
  <li><a href="mailto:{{ site.email }}" title="Email" aria-label="Email">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
  </a></li>
  {% endif %}
  {% if site.scholar %}
  <li><a href="https://scholar.google.com/citations?user={{ site.scholar }}" title="Google Scholar" aria-label="Google Scholar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4 2 9.5l10 5.5 10-5.5L12 4Z"/><path d="M6 12v4.5c0 1.6 2.7 3.5 6 3.5s6-1.9 6-3.5V12"/><path d="M22 9.5V15"/></svg>
  </a></li>
  {% endif %}
  {% if site.github %}
  <li><a href="https://github.com/{{ site.github }}" title="GitHub" aria-label="GitHub">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0 1 12 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/></svg>
  </a></li>
  {% endif %}
  {% if site.gitlab %}
  <li><a href="https://git.ligo.org/{{ site.gitlab }}" title="GitLab (LIGO)" aria-label="GitLab (LIGO)">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m23.955 13.587-1.342-4.135-2.664-8.189a.455.455 0 0 0-.867 0L16.418 9.45H7.582L4.918 1.263a.455.455 0 0 0-.867 0L1.386 9.45.044 13.587a.924.924 0 0 0 .331 1.03L12 23.054l11.625-8.436a.92.92 0 0 0 .33-1.031"/></svg>
  </a></li>
  {% endif %}
  {% if site.twitter.username %}
  <li><a href="https://twitter.com/{{ site.twitter.username }}" title="X (Twitter)" aria-label="X (Twitter)">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.741l7.732-8.835L1.254 2.25H8.08l4.258 5.629 5.906-5.629zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
  </a></li>
  {% endif %}
  {% if site.instagram %}
  <li><a href="https://www.instagram.com/{{ site.instagram }}" title="Instagram" aria-label="Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="0.6" fill="currentColor"/></svg>
  </a></li>
  {% endif %}
</ul>
