# --- Site identity ---------------------------------------------------------
name: Aditya Vijaykumar
title: Aditya Vijaykumar
bio: Schmidt AI in Science Fellow, KICP, The University of Chicago
description: Schmidt AI in Science Fellow at KICP, The University of Chicago, working on gravitational waves

url: https://adivijaykumar.github.io
baseurl: ""
permalink: /:title/

# CV: a copy of the PDF lives in this repo. Refresh it with `pixi run update-cv`.
cv_url: /Vijaykumar_CV.pdf

# Analytics: add a GA4 measurement ID to turn on Google Analytics.
# analytics-google: G-XXXXXXXXXX

# --- Link previews & search (jekyll-seo-tag) -------------------------------
author:
  name: Aditya Vijaykumar
  twitter: alsogoesbyV

twitter:
  username: alsogoesbyV
  card: summary

social:
  name: Aditya Vijaykumar
  links:
    - https://github.com/adivijaykumar
    - https://scholar.google.com/citations?user=cLlRcPYAAAAJ
    - https://twitter.com/alsogoesbyV
    - https://www.instagram.com/adivijaykumar

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile.jpg   # preview image when a page is shared

# --- Contact & profiles (icons in the hero and footer) ---------------------
email: avijaykumar@uchicago.edu
github: adivijaykumar
gitlab: aditya.vijaykumar      # git.ligo.org
instagram: adivijaykumar
scholar: cLlRcPYAAAAJ
# orcid: 0000-0000-0000-0000

# --- Build -----------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-admin
  - jekyll-paginate-v2

compress_html:
  ignore:
    envs:
      - development
      - stage

exclude:
  [
    "README.md",
    "Gemfile",
    "Gemfile.lock",
    "node_modules",
    "vendor",
    "pixi.toml",
    "pixi.lock",
  ]
