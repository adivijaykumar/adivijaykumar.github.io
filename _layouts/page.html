---
layout: default
---
<header class="container page-head reveal">
  {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.lede %}<p class="page-lede">{{ page.lede }}</p>{% endif %}
</header>

<div class="container page-body reveal" style="--delay: 80ms">
  <article class="prose">
    {{ content }}
  </article>
</div>
