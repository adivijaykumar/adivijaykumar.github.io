---
layout: default
---
<header class="container page-head reveal">
  <p class="eyebrow">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>
  <h1 class="page-title">{{ page.title }}</h1>
  {% if page.subtitle %}<p class="page-lede">{{ page.subtitle }}</p>{% endif %}
</header>

<div class="container page-body reveal" style="--delay: 80ms">
  <article class="prose">
    {{ content }}
  </article>
</div>
